app_name: UCC AI Drawing Review Comment Analyzer
version: 1.0.0
environment: development
database:
  db_path: data/ucc_database.db
  wal_mode: true
  echo_sql: false
  timeout_seconds: 30.0
  pool_size: 5
logging:
  log_level: INFO
  log_to_console: true
  log_to_file: true
  log_file_path: data/logs/ucc_app.log
  max_bytes: 10485760
  backup_count: 5
  log_format: '[%(asctime)s] [%(levelname)s] [%(name)s]: %(message)s'
  date_format: '%Y-%m-%d %H:%M:%S'
pdf:
  display_dpi: 150
  ocr_dpi: 300
  thumbnail_dpi: 30
  max_file_size_mb: 500
  allowed_extensions:
  - .pdf
ocr:
  engine: auto
  tesseract_psm: 6
  fallback_psm: 11
  confidence_threshold: 0.5
  annotation_method: hybrid
  filter_template_regions: false
ai:
  classifier_type: hybrid_nlp
  model_path: models/distilbert_classifier
  confidence_threshold: 0.7
  fallback_to_rules: true
ui:
  theme: dark
  language: English (US)
  font_family: Segoe UI Variable
  font_size_scale: 1
  default_projects_dir: dataset/raw_drawings
  rows_per_page: 25
  auto_save: true
  enable_notifications: true
  window_maximized: true
export:
  default_format: Excel
  include_summary_sheet: true
  include_confidence_scores: true
  default_export_dir: exports
